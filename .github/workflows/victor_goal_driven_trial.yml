name: Victor Goal-Driven Architecture Trial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_goal_driven_trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run autonomy regression tests
        run: node --test victor-telegram-worker/autonomy_runtime.test.mjs

      - name: Test current goal selection against canonical state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { selectAutonomyGoal, buildGoalTaskPrompt } from './victor-telegram-worker/autonomy_runtime.mjs';
          const registry = JSON.parse(fs.readFileSync('data/goal_registry.json', 'utf8'));
          const runtime = JSON.parse(fs.readFileSync('data/goal_runtime_state.json', 'utf8'));
          const selection = selectAutonomyGoal(registry, runtime, ['rio','tony_stark','aura3'], Date.now());
          if (!selection) throw new Error('NO_ACTIONABLE_GOAL');
          console.log('SELECTED_GOAL=' + selection.goal.goal_id);
          console.log('SELECTED_TARGET=' + selection.target);
          console.log('GOAL_SCORE=' + selection.score);
          console.log('PROMPT_HAS_HOW_DELEGATED=' + buildGoalTaskPrompt(selection.goal).includes('HOW is delegated'));
          if (selection.goal.goal_id !== 'ORG-REVENUE-001') throw new Error('WRONG_GOAL_SELECTED');
          if (selection.target !== 'rio') throw new Error('WRONG_PRIMARY_ROUTE');
          if (!buildGoalTaskPrompt(selection.goal).includes('HOW is delegated')) throw new Error('HOW_NOT_DELEGATED');
          NODE

      - name: Probe live Victor production health
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url='https://victor-telegram-webhook.vickykenin.workers.dev/health'
          last=None
          for i in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=12) as r:
                      body=r.read().decode()
                      data=json.loads(body)
                      print('LIVE_HTTP_STATUS=', r.status)
                      print('LIVE_SERVICE=', data.get('service'))
                      print('LIVE_STATUS=', data.get('status'))
                      print('LIVE_OPERATING_MODE=', data.get('operating_mode'))
                      print('LIVE_AUTONOMY_CONFIGURED=', data.get('autonomy_runtime_configured'))
                      print('LIVE_RIO_BRIDGE=', data.get('rio_bridge_configured'))
                      print('LIVE_TONY_BRIDGE=', data.get('tony_bridge_configured'))
                      print('LIVE_AURA3_BRIDGE=', data.get('aura3_bridge_configured'))
                      if r.status != 200 or data.get('service') != 'victor-telegram-webhook':
                          raise SystemExit('LIVE_HEALTH_INVALID')
                      if data.get('autonomy_runtime_configured') is not True:
                          raise SystemExit('LIVE_AUTONOMY_NOT_CONFIGURED')
                      break
              except Exception as e:
                  last=e
                  if i==5: raise
                  time.sleep(5)
          PY
