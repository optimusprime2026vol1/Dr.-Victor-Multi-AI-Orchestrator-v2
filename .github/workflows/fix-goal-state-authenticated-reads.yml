name: Fix Goal State Authenticated Reads

on:
  push:
    paths:
      - 'scripts/fix_goal_state_authenticated_reads.py'
      - '.github/workflows/fix-goal-state-authenticated-reads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic repair
        run: python scripts/fix_goal_state_authenticated_reads.py
      - name: Syntax check
        run: node --check victor-telegram-worker/autonomy_runtime.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "Victor Runtime Repair"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/autonomy_runtime.mjs
          git commit -m "runtime: use authenticated canonical goal reads"
          git pull --rebase origin main
          git push origin HEAD:main
