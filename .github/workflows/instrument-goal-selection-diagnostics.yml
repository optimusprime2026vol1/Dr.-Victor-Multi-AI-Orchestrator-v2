name: Instrument Goal Selection Diagnostics

on:
  push:
    paths:
      - 'scripts/instrument_goal_selection_diagnostics.py'
      - '.github/workflows/instrument-goal-selection-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instrument-goal-selection-diagnostics
  cancel-in-progress: false

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply diagnostics
        run: python scripts/instrument_goal_selection_diagnostics.py
      - name: Syntax check
        run: node --check victor-telegram-worker/autonomy_runtime.mjs
      - name: Commit diagnostics
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "Victor Runtime Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/autonomy_runtime.mjs
          git commit -m "runtime: persist goal selection diagnostics"
          git push origin HEAD:main
