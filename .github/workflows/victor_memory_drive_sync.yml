name: Victor Memory Drive Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'memory/**'

permissions:
  contents: read

concurrency:
  group: victor-memory-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive dependencies
        run: pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Run deterministic safety tests
        run: python -m unittest -v tests/test_drive_memory_sync.py
      - name: Sync and verify Victor memory in dedicated Drive folder
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/drive_memory_sync.py
