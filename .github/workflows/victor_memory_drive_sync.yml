name: Victor Memory Drive Sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'memory/**'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive dependencies
        run: pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Sync Victor memory to dedicated Drive folder
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          VICTOR_MEMORY_DRIVE_FOLDER: Victor Memory
        run: python scripts/drive_memory_sync.py
