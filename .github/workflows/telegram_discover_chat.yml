name: Victor Telegram Chat Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/telegram_discover_chat.py'
      - '.github/workflows/telegram_discover_chat.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile discovery helper
        run: python -m py_compile scripts/telegram_discover_chat.py

      - name: Discover management group and reply in Telegram
        env:
          TELEGRAM_BOT_TOKEN_VICTOR: ${{ secrets.TELEGRAM_BOT_TOKEN_VICTOR }}
        run: python scripts/telegram_discover_chat.py

      - name: Upload safe discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victor-telegram-chat-discovery-${{ github.run_id }}
          path: data/telegram_chat_discovery_status.json
          if-no-files-found: error
          retention-days: 7
