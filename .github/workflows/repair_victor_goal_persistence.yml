name: Repair Victor Goal Persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair_victor_goal_persistence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefer orchestration token for runtime state writes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('victor-telegram-worker/autonomy_runtime.mjs')
          s = p.read_text()
          old = "const token = env.GITHUB_MEMORY_TOKEN || env.GITHUB_ORCHESTRATION_TOKEN;"
          new = "const token = env.GITHUB_ORCHESTRATION_TOKEN || env.GITHUB_MEMORY_TOKEN;"
          count = s.count(old)
          if count < 2:
              raise SystemExit(f'Expected at least 2 persistence token selectors, found {count}')
          p.write_text(s.replace(old, new))
          print(f'Updated {count} persistence token selectors')
          PY
      - name: Run autonomy tests
        run: node --test victor-telegram-worker/autonomy_runtime.test.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed'
            exit 0
          fi
          git config user.name 'Victor Autonomy Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add victor-telegram-worker/autonomy_runtime.mjs
          git commit -m 'runtime: repair Victor goal state persistence token priority'
          git push
