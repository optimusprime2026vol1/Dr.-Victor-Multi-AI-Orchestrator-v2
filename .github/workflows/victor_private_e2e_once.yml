name: Victor Private E2E One-Time

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/victor_private_e2e_once.yml'

permissions:
  contents: read

jobs:
  private-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover latest private start and run E2E
        env:
          API_VICTOR: ${{ secrets.API_VICTOR }}
          TELEGRAM_BOT_TOKEN_VICTOR: ${{ secrets.TELEGRAM_BOT_TOKEN_VICTOR }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          api_key=(os.environ.get('API_VICTOR') or '').strip()
          token=(os.environ.get('TELEGRAM_BOT_TOKEN_VICTOR') or '').strip()
          status={'state':'STARTING','ai_inference':{'health':'NOT_RUN'},'telegram_private':{'health':'NOT_RUN'},'secret_values_exposed':False,'updates_consumed':False}

          def tg(method, params=None):
              url=f'https://api.telegram.org/bot{token}/{method}'
              data=urllib.parse.urlencode(params).encode() if params else None
              req=urllib.request.Request(url,data=data,method='POST' if data else 'GET')
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())

          updates=tg('getUpdates', {'timeout':'0','limit':'100','allowed_updates':json.dumps(['message'])}).get('result') or []
          target=None
          for u in reversed(updates):
              m=u.get('message') or {}
              c=m.get('chat') or {}
              txt=str(m.get('text') or '').strip().lower()
              if c.get('type')=='private' and (txt.startswith('/start') or txt):
                  target=c
                  break

          if not target:
              status['state']='NO_PRIVATE_UPDATE'
          else:
              chat_id=str(target.get('id'))
              body=json.dumps({
                  'model':'qwen.qwen3-coder-next',
                  'messages':[
                      {'role':'system','content':'You are Dr. Victor. Reply in one short line confirming a private Telegram end-to-end test succeeded.'},
                      {'role':'user','content':'Begin exactly with: VICTOR PRIVATE E2E OK'}
                  ],
                  'temperature':0,
                  'max_tokens':80
              }).encode()
              req=urllib.request.Request('https://bedrock-mantle.us-east-1.api.aws/v1/chat/completions',data=body,method='POST',headers={'Content-Type':'application/json','Authorization':f'Bearer {api_key}','User-Agent':'victor-private-e2e/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      payload=json.loads(r.read().decode())
                      text=str((((payload.get('choices') or [{}])[0].get('message') or {}).get('content') or '')).strip()
                      status['ai_inference']={'health':'HEALTHY','http_status':r.status,'response_present':bool(text)}
              except urllib.error.HTTPError as e:
                  text=''
                  status['ai_inference']={'health':'FAILED','error_class':'HTTPError','http_status':e.code}
              except Exception as e:
                  text=''
                  status['ai_inference']={'health':'FAILED','error_class':type(e).__name__}

              if text:
                  try:
                      sent=tg('sendMessage',{'chat_id':chat_id,'text':f'🧪 Victor Private E2E\n{text}\n\nYour private Chat ID: {chat_id}'})
                      ok=bool(sent.get('ok'))
                      status['telegram_private']={'health':'HEALTHY' if ok else 'FAILED','message_sent':ok,'chat_type':((sent.get('result') or {}).get('chat') or {}).get('type') if ok else None}
                  except urllib.error.HTTPError as e:
                      status['telegram_private']={'health':'FAILED','error_class':'HTTPError','http_status':e.code,'message_sent':False}
                  except Exception as e:
                      status['telegram_private']={'health':'FAILED','error_class':type(e).__name__,'message_sent':False}
              else:
                  status['telegram_private']={'health':'SKIPPED_AI_FAILED','message_sent':False}

              status['state']='PASS' if status['ai_inference'].get('health')=='HEALTHY' and status['telegram_private'].get('health')=='HEALTHY' else 'FAIL'

          Path('data').mkdir(exist_ok=True)
          Path('data/victor_private_e2e_status.json').write_text(json.dumps(status,indent=2)+'\n')
          print(json.dumps(status))
          raise SystemExit(0 if status['state']=='PASS' else 1)
          PY

      - name: Upload safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victor-private-e2e-${{ github.run_id }}
          path: data/victor_private_e2e_status.json
          if-no-files-found: error
          retention-days: 7
