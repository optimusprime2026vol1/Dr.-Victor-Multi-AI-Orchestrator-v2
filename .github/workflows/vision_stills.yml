name: Vision EP001 Auto Stills

on:
  workflow_dispatch:
    inputs:
      only_ids:
        description: "e.g. A1"
        required: false
        default: "A1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show env (safe)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "repo=$GITHUB_REPOSITORY"
          echo "ref=$GITHUB_REF"
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "STATUS=GEMINI_API_KEY_EMPTY"
          else
            echo "STATUS=GEMINI_API_KEY_SET"
            echo "KEY_LEN=${#GEMINI_API_KEY}"
          fi
          test -f vision/scripts/auto_generate_stills.py && echo "SCRIPT=OK" || echo "SCRIPT=MISSING"
          python3 --version

      - name: Generate stills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY_IDS: ${{ inputs.only_ids }}
        run: |
          set -x
          python3 vision/scripts/auto_generate_stills.py

      - name: Upload stills + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep001-stills
          path: vision/episodes/EP001_Last_Delivery/stills/
          if-no-files-found: warn

      - name: Commit stills
        if: success()
        run: |
          git config user.name vision-bot
          git config user.email vision-bot@users.noreply.github.com
          git add vision/episodes/EP001_Last_Delivery/stills/ || true
          git diff --staged --quiet || git commit -m "vision: EP001 stills auto"
          git push || true
