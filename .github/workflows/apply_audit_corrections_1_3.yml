name: Apply Audit Corrections 1-3
on:
  push:
    paths: ['.github/workflows/apply_audit_corrections_1_3.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: victor-audit-corrections-1-3
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          # Phase 1: robust persistence: token fallback + bounded SHA-conflict retry.
          p=Path('victor-telegram-worker/autonomy_runtime.mjs')
          s=p.read_text()
          start=s.index('async function updateRepoJson(')
          end=s.index('\nexport async function persistAutonomyEvidence', start)
          new=r'''async function updateRepoJson(env, path, next, message) {
  const tokens = [...new Set([env.GITHUB_ORCHESTRATION_TOKEN, env.GITHUB_MEMORY_TOKEN].filter(Boolean))];
  if (!tokens.length) throw new Error('GOAL_STATE_TOKEN_NOT_CONFIGURED');
  const api = `https://api.github.com/repos/${VICTOR_REPO}/contents/${path}`;
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(next, null, 2) + '\n')));
  let lastError = 'UNKNOWN';
  for (const token of tokens) {
    const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', 'User-Agent': 'Dr-Victor-Goal-Runtime/2.0' };
    for (let attempt = 1; attempt <= 3; attempt += 1) {
      const currentResponse = await fetch(`${api}?ref=main&t=${Date.now()}`, { headers, cache: 'no-store' });
      if (!currentResponse.ok) { lastError = `READ_HTTP_${currentResponse.status}`; if ([401,403].includes(currentResponse.status)) break; continue; }
      const currentFile = await currentResponse.json();
      const updateResponse = await fetch(api, { method: 'PUT', headers, body: JSON.stringify({ message, content: encoded, sha: currentFile.sha, branch: 'main' }) });
      if (updateResponse.ok) return next;
      lastError = `WRITE_HTTP_${updateResponse.status}`;
      if ([401,403].includes(updateResponse.status)) break;
      if (updateResponse.status === 409 || updateResponse.status === 422) { await new Promise(r => setTimeout(r, attempt * 750)); continue; }
      break;
    }
  }
  throw new Error(`GOAL_STATE_PERSIST_FAILED_${lastError}`);
}
'''
          s=s[:start]+new+s[end:]
          # Autonomy evidence uses same hardened writer rather than duplicate fragile PUT logic.
          start=s.index('export async function persistAutonomyEvidence(')
          end=s.index('\nfunction availableDepartments', start)
          new=r'''export async function persistAutonomyEvidence(env, controller, result) {
  const previous = await readRepoJsonRaw(`${RAW_BASE}/${AUTONOMY_STATE_PATH}`, {});
  const next = buildAutonomyEvidence(previous, result, controller);
  return updateRepoJson(env, AUTONOMY_STATE_PATH, next, `Record Victor goal-driven cycle: ${result.status}`);
}
'''
          s=s[:start]+new+s[end:]
          # Phase 2: make revenue-zero commercial execution explicit in every goal contract.
          needle="    'Operating rule: the target is fixed; HOW is delegated. Choose the highest-impact valid next action yourself, execute it inside existing authority, and change the plan if the previous route is weak or blocked.',"
          add=needle+"\n    'Commercial priority rule: when verified revenue is zero and executable offers/actions exist, prioritize the closest policy-valid revenue/conversion action. Planning, readiness documents, or pillar rotation must not displace an executable higher-impact commercial action unless they remove a verified blocker.',"
          if 'Commercial priority rule:' not in s: s=s.replace(needle,add)
          p.write_text(s)

          # Phase 2 bridge: Victor goal contracts must reach RIO as GOAL_EXECUTE and may use already-authorized production capabilities.
          p=Path('victor-telegram-worker/department_bridge.mjs'); s=p.read_text()
          needle="  const value = String(text || '').toLowerCase();\n  if (/activat|start|resume|kaam par|self.?mode/.test(value)) return 'PRIORITY_CHECK';"
          repl="  const value = String(text || '').toLowerCase();\n  if (/victor goal contract|goal id:|org-revenue-001|replan_execute/.test(value)) return 'GOAL_EXECUTE';\n  if (/activat|start|resume|kaam par|self.?mode/.test(value)) return 'PRIORITY_CHECK';"
          s=s.replace(needle,repl,1)
          old="external_action_authorized: false"
          s=s.replace(old,"external_action_authorized: taskType === 'GOAL_EXECUTE'",1)
          p.write_text(s)

          # Phase 3: canonical communication architecture reconciliation.
          p=Path('data/department_registry.json'); d=json.loads(p.read_text())
          d['schema_version']=10
          d['telegram']={
            'mode':'founder_private_victor', 'leader':'Dr. Victor',
            'management_group':'RETIRED', 'management_group_publishing_allowed':False,
            'private_chat_id_secret_name':'TELEGRAM_CHAT_ID_VICTOR',
            'bot_token_secret_name':'TELEGRAM_BOT_TOKEN_VICTOR', 'configured':True,
            'department_communication':'INTERNAL_MACHINE_TO_MACHINE_WITH_EVIDENCE',
            'founder_reporting_owner':'Dr. Victor',
            'note':'Founder-facing communication is private Victor chat. Raw department task/evidence traffic is internal unless Founder explicitly requests inspection.'
          }
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Test
        run: |
          node --check victor-telegram-worker/autonomy_runtime.mjs
          node --check victor-telegram-worker/department_bridge.mjs
          node --test victor-telegram-worker/autonomy_runtime.test.mjs
      - name: Commit
        run: |
          git config user.name 'Victor Audit Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add victor-telegram-worker/autonomy_runtime.mjs victor-telegram-worker/department_bridge.mjs data/department_registry.json
          git diff --cached --quiet && exit 0
          git commit -m 'runtime: enforce audit corrections phases 1-3'
          for n in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((n*2)); done
          exit 1
