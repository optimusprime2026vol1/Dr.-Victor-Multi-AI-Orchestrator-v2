name: Apply Audit Corrections 1-3

on:
  push:
    paths:
      - scripts/apply_audit_corrections_1_3.py
      - .github/workflows/apply_audit_corrections_1_3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: victor-audit-corrections-1-3
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrections
        run: python3 scripts/apply_audit_corrections_1_3.py
      - name: Validate runtime
        run: |
          node --check victor-telegram-worker/autonomy_runtime.mjs
          node --check victor-telegram-worker/department_bridge.mjs
          node --test victor-telegram-worker/autonomy_runtime.test.mjs
      - name: Commit corrections
        run: |
          git config user.name "Victor Audit Repair"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/autonomy_runtime.mjs victor-telegram-worker/department_bridge.mjs data/department_registry.json
          if git diff --cached --quiet; then
            echo "No correction diff"
            exit 0
          fi
          git commit -m "runtime: enforce audit corrections phases 1-3"
          git pull --rebase origin main
          git push origin HEAD:main
